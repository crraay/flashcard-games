<div class="game-completion-overlay">
  <div class="game-completion-message">
    <h3>{{ title }}</h3>
    <div *ngIf="prize" class="prize-container">
      <img
        *ngIf="prize.imageUrl && !prizeImageUnavailable"
        [src]="prize.imageUrl"
        [alt]="prize.caption"
        class="prize-image"
        (error)="onPrizeImageError()">
      <span
        *ngIf="!prize.imageUrl || prizeImageUnavailable"
        class="prize-image prize-image--emoji"
        aria-hidden="true">🎁</span>
      <p class="prize-caption">{{ prize.caption }}</p>
    </div>
    <div *ngIf="message" class="message-content" [innerHTML]="getFormattedMessage()"></div>
    <button
      *ngIf="showRestart"
      class="restart-button"
      (click)="onRestart()"
      type="button">
      Play Again
    </button>
  </div>
</div>
